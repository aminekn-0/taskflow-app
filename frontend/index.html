<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <!-- for TaskFlow i logo -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="login.css">
    <title>Login & Signup - TaskFlow</title>
</head>

<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <span>TaskFlow</span>
            </div>

            <!-- LOGIN FORM CONTAINER -->
            <div id="loginContainer" class="form-container active">
                <h1>Login</h1>
                <div class="sub-message">
                    Don't have an account? <a id="switchToSignupLink">Create account</a>
                </div>
            </div>

            <!-- SIGNUP FORM CONTAINER -->
            <div id="signupContainer" class="form-container">
                <h1>Signup</h1>
                <div class="sub-message">
                    Already have an account? <a id="switchToLoginLink">Sign in here</a>
                </div>
            </div>
        </div>

        <!-- LOGIN FORM -->
        <div id="loginFormContainer" class="form-container active">
            <form id="loginForm" action="#" method="post">
                <div class="input-group">
                    <label class="input-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="input-field"
                        placeholder="johndoe or email@example.com" autocomplete="username">
                </div>
                <div class="input-group">
                    <label class="input-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="input-field" placeholder="••••••••"
                        autocomplete="current-password">
                </div>
                <div class="show-password-wrapper">
                    <input type="checkbox" id="showLoginPassword" class="show-password-checkbox">
                    <label for="showLoginPassword" class="show-password-label">
                        <i class="fa-regular fa-eye"></i> Show Password
                    </label>
                </div>

                <div class="options-row">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="rememberCheckbox" name="remember">
                        <span>Remember Me</span>
                    </label>
                    <a id="forgotPasswordLink" class="forgot-link">Forgot Password</a>
                </div>

                <button type="submit" class="auth-btn" id="loginSubmitBtn">Get Started →</button>
            </form>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupFormContainer" class="form-container">
            <form id="signupForm" action="#" method="post">
                <div class="input-group">
                    <label class="input-label" for="signupName">Full Name</label>
                    <input type="text" id="signupName" name="signupName" class="input-field" placeholder="John Doe"
                        autocomplete="name">
                </div>
                <div class="input-group">
                    <label class="input-label" for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" name="signupEmail" class="input-field"
                        placeholder="hello@example.com" autocomplete="email">
                </div>
                <div class="input-group">
                    <label class="input-label" for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" name="signupPassword" class="input-field"
                        placeholder="Create a strong password" autocomplete="new-password">
                    <div class="password-hint">• At least 8 characters</div>
                </div>
                <div class="input-group">
                    <label class="input-label" for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="input-field"
                        placeholder="Confirm your password" autocomplete="off">
                </div>
                <div class="show-password-wrapper">
                    <input type="checkbox" id="showSignupPassword" class="show-password-checkbox">
                    <label for="showSignupPassword" class="show-password-label">
                        <i class="fa-regular fa-eye"></i> Show Password
                    </label>
                </div>

                <div class="terms-row">
                    <label class="terms-wrapper">
                        <input type="checkbox" id="termsCheckbox">
                        <span>I agree to the <a href="#" id="termsLink">Terms of Service</a> and <a href="#"
                                id="privacyLink">Privacy Policy</a></span>
                    </label>
                </div>

                <button type="submit" class="auth-btn" id="signupSubmitBtn">Create Account →</button>
            </form>
        </div>

        <!-- SWITCH PROMPT (visible on both) -->
        <div id="switchPromptLogin" class="switch-prompt">
            <div class="switch-text">New to TaskFlow?</div>
            <button class="switch-btn" id="goToSignupBtn">
                🌟 Create Account
            </button>
        </div>

        <div id="switchPromptSignup" class="switch-prompt" style="display: none;">
            <div class="switch-text">Already have an account?</div>
            <button class="switch-btn" id="goToLoginBtn">
                🔐 Sign In
            </button>
        </div>

        <!-- demo message -->
        <div class="demo-message" id="demoInfo">
            ⚡ demo: any credentials • visual feedback only
        </div>
    </div>

    <!-- ## FrontEnd JavaScript## -->
    <script src="login.js"></script>
</body>

</html>
